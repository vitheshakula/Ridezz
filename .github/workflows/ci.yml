name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ridezz
          POSTGRES_PASSWORD: ridezz
          POSTGRES_DB: ridezz_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridezz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ridezz:ridezz@localhost:5432/ridezz
      TEST_DATABASE_URL: postgresql://ridezz:ridezz@localhost:5432/ridezz_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (JS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=critical

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: cp .env.dev.example .env.dev
      - name: Kotlin unit tests and dev debug build
        working-directory: mobile/android
        run: ./gradlew testDevDebugUnitTest assembleDevDebug --no-daemon
