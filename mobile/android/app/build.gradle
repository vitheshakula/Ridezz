apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def appFlavors = ["dev", "staging", "prod"]
project.ext.envConfigFiles = [
    dev    : ".env.dev",
    staging: ".env.staging",
    prod   : ".env.prod",
]

def appBuildTask = ~/(?i)(assemble|bundle|install)(debug|debugoptimized|release)?/
def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
if (requestedTasks.any { it ==~ appBuildTask }) {
    throw new GradleException(
        "Name the environment in the task, e.g. installDevDebug, assembleStagingRelease or " +
        "bundleProdRelease (got: ${requestedTasks.join(' ')}).")
}
def requestedFlavors = appFlavors.findAll { flavor ->
    requestedTasks.any { it.toLowerCase() ==~ /[a-z]+${flavor}(debug|debugoptimized|release).*/ }
}
if (requestedFlavors.size() > 1) {
    throw new GradleException(
        "Build one environment per Gradle invocation (got ${requestedFlavors.join(', ')}): " +
        "the env file is chosen once per run.")
}

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    debuggableVariants = appFlavors.collectMany { [it + "Debug", it + "DebugOptimized"] }

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rideaze.mobile"
    defaultConfig {
        applicationId "com.rideaze.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        resValue "string", "build_config_package", "com.rideaze.mobile"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Rideaze Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "Rideaze Staging"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "Rideaze"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation 'com.alphacephei:vosk-android:0.3.47'

    implementation 'com.google.android.gms:play-services-nearby:19.3.0'

    testImplementation 'junit:junit:4.13.2'
}
