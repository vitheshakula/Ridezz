services:
  - type: web
    name: ridezz-api-staging
    runtime: node
    rootDir: server
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: ridezz-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ridezz-cache-staging
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false

  - type: web
    name: ridezz-api
    runtime: node
    rootDir: server
    branch: master
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: ridezz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ridezz-cache
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false

  - type: keyvalue
    name: ridezz-cache-staging
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: keyvalue
    name: ridezz-cache
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: ridezz-db-staging
    databaseName: ridezz
    postgresMajorVersion: '16'
  - name: ridezz-db
    databaseName: ridezz
    postgresMajorVersion: '16'
